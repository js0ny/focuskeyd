[package]
name = "focuskeyd"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
evdev = { version = "0.13.2", features = ["serde"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
